name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/br/dev/rf/tsuki

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TsukiPlayer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.dev.rf.tsuki"
              compileSdk = 34

              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file("tsuki.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              defaultConfig {
                  applicationId = "br.dev.rf.tsuki"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Tsuki Player"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          cat > app/src/main/res/drawable/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0F0B1E" android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#2C2350" android:pathData="M54,54m-27,0a27,27 0,1 1,54 0a27,27 0,1 1,-54 0" />
              <path android:fillColor="#00000000" android:strokeColor="#E889B5" android:strokeWidth="1.2" android:pathData="M54,54m-29.5,0a29.5,29.5 0,1 1,59 0a29.5,29.5 0,1 1,-59 0" />
              <path android:fillColor="#E889B5" android:pathData="M22,32m-2.4,0a2.4,2.4 0,1 1,4.8 0a2.4,2.4 0,1 1,-4.8 0" />
              <path android:fillColor="#E889B5" android:pathData="M86,78m-2.4,0a2.4,2.4 0,1 1,4.8 0a2.4,2.4 0,1 1,-4.8 0" />
              <path android:fillColor="#8FD3E8" android:pathData="M30,86m-1.8,0a1.8,1.8 0,1 1,3.6 0a1.8,1.8 0,1 1,-3.6 0" />
              <group android:rotation="45" android:pivotX="54" android:pivotY="54" android:scaleX="0.85" android:scaleY="0.85">
                  <path android:fillColor="#F1F5FB" android:pathData="M50,68L50,24L54,14L54,68Z" />
                  <path android:fillColor="#A9B8D0" android:pathData="M54,14L58,20L58,68L54,68Z" />
                  <path android:fillColor="#D9B25F" android:pathData="M43,70a11,3 0,1 0,22 0a11,3 0,1 0,-22 0z" />
                  <path android:fillColor="#6B4FA0" android:pathData="M51,72L57,72L57,92L51,92Z" />
                  <path android:fillColor="#00000000" android:strokeColor="#E889B5" android:strokeWidth="1" android:pathData="M51,76L57,79M51,81L57,84M51,86L57,89" />
                  <path android:fillColor="#D9B25F" android:pathData="M50.5,92L57.5,92L57.5,95L50.5,95Z" />
              </group>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > app/src/main/java/br/dev/rf/tsuki/MainActivity.kt <<'EOF'
          package br.dev.rf.tsuki

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ContentUris
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaMetadataRetriever
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.MediaStore
          import android.text.SpannableStringBuilder
          import android.text.Spanned
          import android.text.TextUtils
          import android.text.style.ForegroundColorSpan
          import android.util.Size
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          data class Song(
              val id: Long,
              val title: String,
              val artist: String,
              val album: String,
              val dur: Long,
              val path: String
          ) {
              fun uri(): Uri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)
          }

          class Theme(
              val name: String,
              val bg: Int,
              val bg2: Int,
              val a1: Int,
              val a2: Int,
              val a3: Int,
              val light: Boolean,
              val kanji: String
          )

          fun withAlpha(c: Int, a: Int): Int = (c and 0x00FFFFFF) or (a shl 24)

          fun hc(h: String): Int = Color.parseColor(h)

          fun mix(c1: Int, c2: Int, t: Float): Int {
              val r = (Color.red(c1) * (1 - t) + Color.red(c2) * t).toInt()
              val g = (Color.green(c1) * (1 - t) + Color.green(c2) * t).toInt()
              val b = (Color.blue(c1) * (1 - t) + Color.blue(c2) * t).toInt()
              return Color.rgb(r, g, b)
          }

          class MainActivity : Activity() {
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private var PINK = 0
              private var CYAN = 0
              private var BG = 0
              private var PANEL = 0
              private var PANEL2 = 0
              private var LILAC = 0
              private var GRAY = 0
              private var LINE = 0
              private var CARD1 = 0
              private var CARD2 = 0
              private var CARD_LINE = 0
              private var LIST_DIV = 0
              private var TRACK = 0
              private var BG2 = 0
              private var TEXT = 0
              private var ON_ACCENT = 0
              private var WATER = 0
              private var KANJI = ""

              private val themes = listOf(
                  Theme("Tsuki (padrão)", hc("#0B0B14"), hc("#0B0B14"), hc("#E889B5"), hc("#8FD3E8"), hc("#B9AEE6"), false, "月"),
                  Theme("Sakura (claro)", hc("#FBEFF3"), hc("#F3D7E3"), hc("#D6568A"), hc("#7A6AC9"), hc("#A04C78"), true, "桜"),
                  Theme("Oceano", hc("#0F3557"), hc("#071B30"), hc("#5FC4F0"), hc("#7FE6D6"), hc("#A9D3EE"), false, "海"),
                  Theme("Matcha (claro)", hc("#EEF4E6"), hc("#D9E8CB"), hc("#4F8A4B"), hc("#A8862F"), hc("#5E7F52"), true, "茶"),
                  Theme("Pôr do sol", hc("#34163A"), hc("#8A3040"), hc("#FFB27A"), hc("#FFD98A"), hc("#FFCDB8"), false, "夕"),
                  Theme("Roxo meia-noite", hc("#241A55"), hc("#0B0820"), hc("#B48CFF"), hc("#7FA8FF"), hc("#CDBDFF"), false, "夜"),
                  Theme("Washi (claro)", hc("#F4EFE4"), hc("#E4DAC6"), hc("#B3262B"), hc("#2F4A6B"), hc("#6B5B45"), true, "刀"),
                  Theme("Vermelho samurai", hc("#40101A"), hc("#14060A"), hc("#F0605F"), hc("#F0C078"), hc("#F0B8B8"), false, "武"),
                  Theme("Café e ouro", hc("#3D2B1F"), hc("#1E140E"), hc("#E2B866"), hc("#F0DDB0"), hc("#D8C3A0"), false, "金"),
                  Theme("Gelo (claro)", hc("#E9F4FB"), hc("#CFE4F2"), hc("#2C7DA6"), hc("#4A93B8"), hc("#3F6C8A"), true, "氷")
              )

              private var dragFrom = -1
              private var dragMoved = false
              private var lastX = 0
              private var lastY = 0
              private var queueSource = ""

              private var nowTitle = ""
              private var nowArtist = ""
              private var nowInfo = ""
              private var nowArt: Bitmap? = null
              private val noArt = HashSet<String>()

              private val allSongs = ArrayList<Song>()
              private var shown = ArrayList<Song>()
              private var queue = ArrayList<Song>()
              private var index = -1
              private var mode = 0
              private var curPl = ""
              private val rows = ArrayList<Pair<String, String>>()
              private var mp: MediaPlayer? = null
              private var dragging = false
              private val handler = Handler(Looper.getMainLooper())

              private lateinit var prefs: SharedPreferences
              private lateinit var art: ImageView
              private lateinit var titleTv: TextView
              private lateinit var artistTv: TextView
              private lateinit var infoTv: TextView
              private lateinit var curTv: TextView
              private lateinit var durTv: TextView
              private lateinit var seek: SeekBar
              private lateinit var playBtn: TextView
              private lateinit var sectionTv: TextView
              private lateinit var hintTv: TextView
              private lateinit var list: ListView

              private val adapter = object : BaseAdapter() {
                  override fun getCount(): Int = rows.size
                  override fun getItem(p: Int): Any = rows[p]
                  override fun getItemId(p: Int): Long = p.toLong()
                  override fun getView(p: Int, v: View?, parent: ViewGroup?): View {
                      val view = v ?: layoutInflater.inflate(android.R.layout.simple_list_item_2, parent, false)
                      val t1 = view.findViewById<TextView>(android.R.id.text1)
                      val t2 = view.findViewById<TextView>(android.R.id.text2)
                      val cur = queue.getOrNull(index)
                      val playing = cur != null && p < shown.size && shown[p].id == cur.id
                      t1.text = (if (playing) "♪ " else "") + rows[p].first
                      t1.setTextColor(if (playing) PINK else TEXT)
                      t1.maxLines = 1
                      t1.ellipsize = TextUtils.TruncateAt.END
                      view.setBackgroundColor(if (p == dragFrom) mix(BG, PINK, 0.28f) else Color.TRANSPARENT)
                      t2.text = rows[p].second
                      t2.setTextColor(LILAC)
                      t2.maxLines = 1
                      t2.ellipsize = TextUtils.TruncateAt.END
                      return view
                  }
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      val m = mp
                      if (m != null && !dragging) {
                          try {
                              if (m.isPlaying) {
                                  seek.progress = m.currentPosition
                                  curTv.text = fmt(m.currentPosition)
                              }
                          } catch (e: Exception) {
                          }
                      }
                      handler.postDelayed(this, 500)
                  }
              }

              private val dragScroll = object : Runnable {
                  override fun run() {
                      if (dragFrom < 0) return
                      val dy = if (lastY < dp(56)) -dp(10) else if (lastY > list.height - dp(56)) dp(10) else 0
                      if (dy != 0) {
                          list.scrollListBy(dy)
                          updateDrag(lastX, lastY)
                      }
                      handler.postDelayed(this, 30)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  prefs = getSharedPreferences("tsuki", MODE_PRIVATE)
                  applyTheme(prefs.getInt("theme", 0))
                  try {
                      filesDir.listFiles()?.forEach { if (it.name.startsWith("art_")) it.delete() }
                  } catch (e: Exception) {
                  }
                  buildUi()
                  handler.post(ticker)
                  val perm = if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO else Manifest.permission.READ_EXTERNAL_STORAGE
                  if (checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED) loadSongs() else requestPermissions(arrayOf(perm), 1)
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  if (res.isNotEmpty() && res[0] == PackageManager.PERMISSION_GRANTED) loadSongs()
                  else toast("Permita o acesso às músicas para usar o app")
              }

              override fun onDestroy() {
                  handler.removeCallbacks(ticker)
                  mp?.release()
                  mp = null
                  super.onDestroy()
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (mode == 1) showSongs() else super.onBackPressed()
              }

              // ---------- temas ----------

              @Suppress("DEPRECATION")
              private fun applyTheme(i: Int) {
                  val t = themes[if (i in themes.indices) i else 0]
                  BG = t.bg
                  BG2 = t.bg2
                  PINK = t.a1
                  CYAN = t.a2
                  LILAC = t.a3
                  KANJI = t.kanji
                  val fg = if (t.light) hc("#231F33") else Color.WHITE
                  TEXT = fg
                  if (t.light) {
                      PANEL = mix(t.bg, Color.WHITE, 0.6f)
                      PANEL2 = mix(t.bg, Color.WHITE, 0.35f)
                      CARD1 = withAlpha(mix(t.bg, Color.WHITE, 0.65f), 235)
                      CARD2 = withAlpha(mix(t.bg, Color.WHITE, 0.4f), 235)
                      CARD_LINE = mix(t.bg, t.a2, 0.4f)
                      LIST_DIV = mix(t.bg, fg, 0.12f)
                      TRACK = mix(t.bg, fg, 0.2f)
                      GRAY = mix(t.bg, fg, 0.6f)
                      WATER = mix(t.bg, t.a1, 0.16f)
                  } else {
                      PANEL = mix(t.bg, Color.WHITE, 0.09f)
                      PANEL2 = mix(t.bg, Color.WHITE, 0.03f)
                      CARD1 = withAlpha(mix(t.bg, Color.WHITE, 0.07f), 235)
                      CARD2 = withAlpha(mix(t.bg2, Color.WHITE, 0.03f), 235)
                      CARD_LINE = mix(t.bg, t.a2, 0.28f)
                      LIST_DIV = mix(t.bg, Color.WHITE, 0.09f)
                      TRACK = mix(t.bg, Color.WHITE, 0.24f)
                      GRAY = mix(t.bg, Color.WHITE, 0.55f)
                      WATER = mix(t.bg, t.a1, 0.13f)
                  }
                  LINE = mix(t.bg, t.a1, 0.5f)
                  ON_ACCENT = if (Color.luminance(t.a1) > 0.5f) hc("#14121F") else Color.WHITE
                  window.statusBarColor = t.bg
                  window.navigationBarColor = t.bg2
                  window.decorView.systemUiVisibility =
                      if (t.light) (View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR) else 0
              }

              private fun showThemesDialog() {
                  val cur = prefs.getInt("theme", 0)
                  val items = Array<CharSequence>(themes.size) { i ->
                      val t = themes[i]
                      val sb = SpannableStringBuilder("●●●  " + (i + 1) + ". " + t.name)
                      sb.setSpan(ForegroundColorSpan(t.a1), 0, 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.setSpan(ForegroundColorSpan(t.a2), 1, 2, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb.setSpan(ForegroundColorSpan(t.a3), 2, 3, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      sb
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Temas de cores")
                      .setSingleChoiceItems(items, cur) { d, w ->
                          prefs.edit().putInt("theme", w).apply()
                          applyTheme(w)
                          d.dismiss()
                          rebuildUi()
                      }
                      .setNegativeButton("Fechar", null)
                      .show()
              }

              private fun rebuildUi() {
                  buildUi()
                  refresh()
                  restoreNow()
              }

              private fun restoreNow() {
                  if (queue.getOrNull(index) == null) return
                  titleTv.text = nowTitle
                  artistTv.text = nowArtist
                  infoTv.text = nowInfo
                  val ba = nowArt
                  if (ba != null) art.setImageBitmap(ba)
                  val m = mp
                  if (m != null) {
                      try {
                          seek.max = m.duration
                          seek.progress = m.currentPosition
                          durTv.text = fmt(m.duration)
                          curTv.text = fmt(m.currentPosition)
                          playBtn.text = if (m.isPlaying) "❚❚" else "▶"
                      } catch (e: Exception) {
                      }
                  }
              }

              // ---------- utilidades ----------

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun toast(m: String) {
                  Toast.makeText(this, m, Toast.LENGTH_SHORT).show()
              }

              private fun fmt(ms: Int): String {
                  val t = ms / 1000
                  return String.format("%d:%02d", t / 60, t % 60)
              }

              private fun box(color: Int, stroke: Int, radius: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(radius).toFloat()
                  g.setStroke(Math.max(1, (1.5f * resources.displayMetrics.density).toInt()), stroke)
                  return g
              }

              private fun gradBox(c1: Int, c2: Int, stroke: Int, radius: Int): GradientDrawable {
                  val g = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(c1, c2))
                  g.cornerRadius = dp(radius).toFloat()
                  g.setStroke(Math.max(1, (1.5f * resources.displayMetrics.density).toInt()), stroke)
                  return g
              }

              private fun divider(): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val l = View(this)
                  l.background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(Color.TRANSPARENT, LINE))
                  val r = View(this)
                  r.background = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(LINE, Color.TRANSPARENT))
                  val mid = TextView(this)
                  mid.text = "✦"
                  mid.setTextColor(PINK)
                  mid.textSize = 10f
                  mid.setPadding(dp(8), 0, dp(8), 0)
                  row.addView(l, LinearLayout.LayoutParams(0, dp(1), 1f))
                  row.addView(mid, LinearLayout.LayoutParams(WRAP, WRAP))
                  row.addView(r, LinearLayout.LayoutParams(0, dp(1), 1f))
                  return row
              }

              private fun btn(label: String, size: Float, click: () -> Unit): TextView {
                  val b = TextView(this)
                  b.text = label
                  b.textSize = size
                  b.setTextColor(TEXT)
                  b.typeface = Typeface.DEFAULT_BOLD
                  b.gravity = Gravity.CENTER
                  b.includeFontPadding = false
                  b.background = box(PANEL, PINK, 16)
                  b.isClickable = true
                  b.setOnClickListener { click() }
                  b.setOnTouchListener { v, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) v.alpha = 0.55f
                      if (e.action == MotionEvent.ACTION_UP || e.action == MotionEvent.ACTION_CANCEL) v.alpha = 1f
                      false
                  }
                  return b
              }

              // ---------- interface ----------

              private fun buildUi() {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.clipToPadding = false
                  root.clipChildren = false
                  root.setPadding(dp(14), dp(10), dp(14), dp(26))

                  fun div(top: Int, bottom: Int) {
                      val lp = LinearLayout.LayoutParams(MATCH, WRAP)
                      lp.topMargin = dp(top)
                      lp.bottomMargin = dp(bottom)
                      root.addView(divider(), lp)
                  }

                  val head = TextView(this)
                  head.text = "✦ ツキ・プレイヤー ✦"
                  head.setTextColor(PINK)
                  head.textSize = 16f
                  head.typeface = Typeface.DEFAULT_BOLD
                  head.gravity = Gravity.CENTER
                  root.addView(head, LinearLayout.LayoutParams(MATCH, WRAP))

                  // capa do álbum
                  val side = (resources.displayMetrics.widthPixels * 0.36).toInt()
                  val frame = FrameLayout(this)
                  frame.background = gradBox(PANEL, PANEL2, CYAN, 22)
                  frame.setPadding(dp(6), dp(6), dp(6), dp(6))
                  val note = TextView(this)
                  note.text = "♪"
                  note.textSize = 52f
                  note.setTextColor(PINK)
                  note.gravity = Gravity.CENTER
                  frame.addView(note, FrameLayout.LayoutParams(MATCH, MATCH))
                  art = ImageView(this)
                  art.scaleType = ImageView.ScaleType.CENTER_CROP
                  art.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(v: View, o: Outline) {
                          o.setRoundRect(0, 0, v.width, v.height, dp(16).toFloat())
                      }
                  }
                  art.clipToOutline = true
                  frame.addView(art, FrameLayout.LayoutParams(MATCH, MATCH))
                  frame.setOnLongClickListener {
                      val cs = queue.getOrNull(index)
                      if (cs != null) {
                          AlertDialog.Builder(this)
                              .setTitle("Capa do álbum")
                              .setMessage("Apagar as capas guardadas e buscar de novo na internet?")
                              .setPositiveButton("Buscar") { _, _ ->
                                  try {
