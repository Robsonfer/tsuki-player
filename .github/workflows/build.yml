              // ---------- biblioteca ----------

              private fun loadSongs() {
                  allSongs.clear()
                  val proj = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.ARTIST,
                      MediaStore.Audio.Media.ALBUM,
                      MediaStore.Audio.Media.DURATION,
                      MediaStore.Audio.Media.DATA
                  )
                  val sel = MediaStore.Audio.Media.IS_MUSIC + " != 0 AND " + MediaStore.Audio.Media.DURATION + " >= 20000"
                  try {
                      contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, proj, sel, null,
                          MediaStore.Audio.Media.TITLE + " COLLATE NOCASE ASC"
                      )?.use { c ->
                          while (c.moveToNext()) {
                              var artist = c.getString(2) ?: ""
                              if (artist.isBlank() || artist == "<unknown>") artist = "Artista desconhecido"
                              var album = c.getString(3) ?: ""
                              if (album == "<unknown>") album = ""
                              allSongs.add(
                                  Song(
                                      c.getLong(0),
                                      c.getString(1) ?: "Sem título",
                                      artist,
                                      album,
                                      c.getLong(4),
                                      c.getString(5) ?: ""
                                  )
                              )
                          }
                      }
                  } catch (e: Exception) {
                      toast("Erro ao ler as músicas")
                  }
                  showSongs()
              }

              private fun enabledSongs(): List<Song> {
                  val f: Set<String> = prefs.getStringSet("folders", null)?.toSet() ?: emptySet()
                  return if (f.isEmpty()) allSongs else allSongs.filter { f.contains(File(it.path).parent ?: "") }
              }

              private fun chooseFolders() {
                  val folders = allSongs.map { File(it.path).parent ?: "" }.distinct().sorted()
                  if (folders.isEmpty()) {
                      toast("Nenhuma música encontrada")
                      return
                  }
                  val cur: Set<String> = prefs.getStringSet("folders", null)?.toSet() ?: emptySet()
                  val checked = BooleanArray(folders.size) { cur.isEmpty() || cur.contains(folders[it]) }
                  val names = folders.map { it.removePrefix("/storage/emulated/0/").ifEmpty { "(raiz)" } }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Pastas de música")
                      .setMultiChoiceItems(names, checked) { _, i, v -> checked[i] = v }
                      .setPositiveButton("OK") { _, _ ->
                          val sel = HashSet<String>()
                          for (i in folders.indices) if (checked[i]) sel.add(folders[i])
                          if (sel.isEmpty()) {
                              toast("Escolha ao menos uma pasta")
                          } else {
                              val save = if (sel.size == folders.size) HashSet<String>() else sel
                              prefs.edit().putStringSet("folders", save).apply()
                              showSongs()
                          }
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun showSongs() {
                  mode = 0
                  shown = ArrayList(enabledSongs())
                  refresh()
              }

              private fun openPlaylist(name: String) {
                  mode = 1
                  curPl = name
                  shown = ArrayList(plSongs(name))
                  refresh()
              }

              private fun fillRows() {
                  rows.clear()
                  for (s in shown) rows.add(Pair(s.title, s.artist + "  •  " + fmt(s.dur.toInt())))
                  sectionTv.text = if (mode == 0) "Músicas (" + shown.size + ")" else "♫ " + curPl + " (" + shown.size + ")"
                  hintTv.text = if (mode == 0) "segure a música p/ playlist" else "segure e arraste p/ reordenar"
                  adapter.notifyDataSetChanged()
              }

              private fun refresh() {
                  fillRows()
                  scrollToPlaying()
              }

              // ---------- arrastar para reordenar (dentro da playlist) ----------

              private fun startDrag(p: Int) {
                  dragFrom = p
                  dragMoved = false
                  fillRows()
                  handler.post(dragScroll)
              }

              private fun updateDrag(x: Int, y: Int) {
                  if (dragFrom < 0) return
                  val pos = list.pointToPosition(x, y)
                  if (pos >= 0 && pos < shown.size && pos != dragFrom) {
                      val item = shown.removeAt(dragFrom)
                      shown.add(pos, item)
                      dragFrom = pos
                      dragMoved = true
                      fillRows()
                  }
              }

              private fun endDrag() {
                  val moved = dragMoved
                  val from = dragFrom
                  dragFrom = -1
                  dragMoved = false
                  handler.removeCallbacks(dragScroll)
                  if (moved) {
                      saveOrder(curPl)
                      syncQueue()
                      fillRows()
                      toast("Ordem salva")
                  } else {
                      fillRows()
                      playlistItemMenu(from)
                  }
              }

              private fun saveOrder(name: String) {
                  val o = loadPl()
                  val old = o.optJSONArray(name) ?: JSONArray()
                  val na = JSONArray()
                  val seen = HashSet<Long>()
                  for (s in shown) {
                      na.put(s.id)
                      seen.add(s.id)
                  }
                  for (i in 0 until old.length()) {
                      val id = old.getLong(i)
                      if (!seen.contains(id) && allSongs.none { it.id == id }) na.put(id)
                  }
                  o.put(name, na)
                  savePl(o)
              }

              // se a playlist reordenada é a que está tocando, a nova ordem vale já
              private fun syncQueue() {
                  if (mode != 1 || queueSource != curPl) return
                  val cur = queue.getOrNull(index)
                  queue = ArrayList(shown)
                  if (cur != null) {
                      val ni = shown.indexOfFirst { it.id == cur.id }
                      if (ni >= 0) index = ni
                  }
              }

              private fun playlistItemMenu(p: Int) {
                  if (p < 0 || p >= shown.size) return
                  val s = shown[p]
                  AlertDialog.Builder(this)
                      .setTitle(s.title)
                      .setItems(arrayOf("Remover da playlist", "Copiar para outra playlist")) { _, w ->
                          if (w == 0) {
                              removeFrom(curPl, s)
                              openPlaylist(curPl)
                          } else {
                              addToPlaylist(s)
                          }
                      }
                      .show()
              }

              // mantém a música que está tocando no centro da caixinha
              private fun scrollToPlaying() {
                  val cur = queue.getOrNull(index) ?: return
                  val p = shown.indexOfFirst { it.id == cur.id }
                  if (p < 0) return
                  list.post {
                      val rh = if (list.childCount > 0) list.getChildAt(0).height else dp(64)
                      val off = Math.max(0, (list.height - rh) / 2)
                      if (Math.abs(p - list.firstVisiblePosition) > 25) list.setSelectionFromTop(p, off)
                      else list.smoothScrollToPositionFromTop(p, off, 350)
                  }
              }

              private fun onItem(p: Int) {
                  if (p < shown.size) {
                      queue = ArrayList(shown)
                      queueSource = if (mode == 1) curPl else ""
                      playAt(p)
                  }
              }

              private fun onItemLong(p: Int) {
                  if (p >= shown.size) return
                  if (mode == 0) addToPlaylist(shown[p]) else startDrag(p)
              }

              private fun confirm(msg: String, ok: () -> Unit) {
                  AlertDialog.Builder(this)
                      .setMessage(msg)
                      .setPositiveButton("Sim") { _, _ -> ok() }
                      .setNegativeButton("Não", null)
                      .show()
              }

              // ---------- playlists ----------

              private fun loadPl(): JSONObject {
                  return try {
                      JSONObject(prefs.getString("pl", "{}") ?: "{}")
                  } catch (e: Exception) {
                      JSONObject()
                  }
              }

              private fun savePl(o: JSONObject) {
                  prefs.edit().putString("pl", o.toString()).apply()
              }

              private fun plSongs(name: String): List<Song> {
                  val a = loadPl().optJSONArray(name) ?: return emptyList()
                  val res = ArrayList<Song>()
                  for (i in 0 until a.length()) {
                      val id = a.getLong(i)
                      val s = allSongs.firstOrNull { it.id == id }
                      if (s != null) res.add(s)
                  }
                  return res
              }

              private fun addTo(name: String, song: Song) {
                  val o = loadPl()
                  val a = o.optJSONArray(name) ?: JSONArray()
                  var has = false
                  for (i in 0 until a.length()) if (a.getLong(i) == song.id) has = true
                  if (!has) a.put(song.id)
                  o.put(name, a)
                  savePl(o)
                  toast("Adicionada a \"" + name + "\"")
              }

              private fun removeFrom(name: String, song: Song) {
                  val o = loadPl()
                  val a = o.optJSONArray(name) ?: return
                  val na = JSONArray()
                  for (i in 0 until a.length()) if (a.getLong(i) != song.id) na.put(a.getLong(i))
                  o.put(name, na)
                  savePl(o)
              }

              // caixa de diálogo com todas as playlists
              private fun showPlaylistsDialog() {
                  val names = loadPl().keys().asSequence().sorted().toList()
                  val items = ArrayList<String>()
                  items.add("＋ Nova playlist")
                  for (n in names) items.add("♫ " + n + "  (" + plSongs(n).size + ")")
                  val d = AlertDialog.Builder(this)
                      .setTitle("Playlists  •  segure para apagar")
                      .setItems(items.toTypedArray()) { _, w ->
                          if (w == 0) newPlaylist(null) else openPlaylist(names[w - 1])
                      }
                      .setNegativeButton("Fechar", null)
                      .create()
                  d.show()
                  d.listView.setOnItemLongClickListener { _, _, p, _ ->
                      if (p > 0 && p - 1 < names.size) {
                          val n = names[p - 1]
                          d.dismiss()
                          confirm("Apagar a playlist \"" + n + "\"?") {
                              val o = loadPl()
                              o.remove(n)
                              savePl(o)
                              if (mode == 1 && curPl == n) showSongs()
                              showPlaylistsDialog()
                          }
                      }
                      true
                  }
              }

              private fun addToPlaylist(song: Song) {
                  val names = loadPl().keys().asSequence().sorted().toList()
                  val items = (names + "＋ Nova playlist").toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Adicionar à playlist")
                      .setItems(items) { _, w ->
                          if (w == names.size) newPlaylist(song) else addTo(names[w], song)
                      }
                      .show()
              }

              private fun newPlaylist(song: Song?) {
                  val et = EditText(this)
                  et.hint = "Nome da playlist"
                  et.setSingleLine()
                  et.setTextColor(Color.WHITE)
                  et.setHintTextColor(Color.GRAY)
                  AlertDialog.Builder(this)
                      .setTitle("Nova playlist")
                      .setView(et)
                      .setPositiveButton("Criar") { _, _ ->
                          val n = et.text.toString().trim()
                          if (n.isNotEmpty()) {
                              val o = loadPl()
                              if (!o.has(n)) {
                                  o.put(n, JSONArray())
                                  savePl(o)
                              }
                              if (song != null) addTo(n, song) else showPlaylistsDialog()
                          }
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              // ---------- reprodução ----------

              private fun playAt(i: Int) {
                  if (i < 0 || i >= queue.size) return
                  val s = queue[i]
                  try {
                      mp?.release()
                      mp = null
                      val m = MediaPlayer()
                      m.setWakeMode(applicationContext, PowerManager.PARTIAL_WAKE_LOCK)
                      m.setDataSource(applicationContext, s.uri())
                      m.setOnCompletionListener { next() }
                      m.setOnErrorListener { _, _, _ -> true }
                      m.prepare()
                      m.start()
                      mp = m
                      index = i
                      showNow(s, m.duration)
                  } catch (e: Exception) {
                      toast("Não consegui tocar esta música")
                  }
              }

              private fun showNow(s: Song, dur: Int) {
                  nowTitle = cleanTitle(s.title, "")
                  nowArtist = if (s.album.isNotBlank()) s.artist + "  •  " + s.album else s.artist
                  nowInfo = ""
                  nowArt = null
                  titleTv.text = nowTitle
                  artistTv.text = nowArtist
                  infoTv.text = ""
                  seek.max = dur
                  seek.progress = 0
                  curTv.text = fmt(0)
                  durTv.text = fmt(dur)
                  playBtn.text = "❚❚"
                  art.setImageDrawable(null)
                  adapter.notifyDataSetChanged()
                  scrollToPlaying()
                  loadMeta(s)
              }

              private fun tag(r: MediaMetadataRetriever, k: Int): String {
                  return (r.extractMetadata(k) ?: "").trim()
              }

              // lê capa e informações extras direto do arquivo (tags do MP3)
              private fun loadMeta(s: Song) {
                  val uri = s.uri()
                  Thread {
                      var bmp: Bitmap? = null
                      var detail = ""
                      var trk = ""
                      var albumTag = ""
                      var aaTag = ""
                      var artistTag = ""
                      try {
                          val r = MediaMetadataRetriever()
                          r.setDataSource(applicationContext, uri)
                          val parts = ArrayList<String>()
                          val aa = tag(r, MediaMetadataRetriever.METADATA_KEY_ALBUMARTIST)
                          aaTag = aa
                          albumTag = tag(r, MediaMetadataRetriever.METADATA_KEY_ALBUM)
                          artistTag = tag(r, MediaMetadataRetriever.METADATA_KEY_ARTIST)
                          if (aa.isNotEmpty() && aa != s.artist) parts.add("Álbum de " + aa)
                          val genre = tag(r, MediaMetadataRetriever.METADATA_KEY_GENRE)
                          if (genre.isNotEmpty()) parts.add(genre)
                          var year = tag(r, MediaMetadataRetriever.METADATA_KEY_YEAR)
                          if (year.isEmpty()) year = tag(r, MediaMetadataRetriever.METADATA_KEY_DATE).take(4)
                          if (year.isNotEmpty()) parts.add(year)
                          val track = tag(r, MediaMetadataRetriever.METADATA_KEY_CD_TRACK_NUMBER)
                          trk = track
                          if (track.isNotEmpty()) parts.add("Faixa " + track)
                          val mime = tag(r, MediaMetadataRetriever.METADATA_KEY_MIMETYPE)
                          if (mime.isNotEmpty()) {
                              val f = when {
                                  mime.contains("mpeg") -> "MP3"
                                  mime.contains("mp4") -> "M4A"
                                  else -> mime.substringAfter("/").uppercase()
                              }
                              parts.add(f)
                          }
                          val br = tag(r, MediaMetadataRetriever.METADATA_KEY_BITRATE).toIntOrNull()
                          if (br != null && br > 0) parts.add((br / 1000).toString() + " kbps")
                          detail = parts.joinToString("  •  ")

                          val b = r.embeddedPicture
                          r.release()
                          if (b != null) {
                              val o = BitmapFactory.Options()
                              o.inJustDecodeBounds = true
                              BitmapFactory.decodeByteArray(b, 0, b.size, o)
                              var ss = 1
                              while (o.outWidth / ss > 1000) ss *= 2
                              val o2 = BitmapFactory.Options()
                              o2.inSampleSize = ss
                              bmp = BitmapFactory.decodeByteArray(b, 0, b.size, o2)
                          }
                      } catch (e: Exception) {
                      }
                      if (bmp == null) {
                          try {
                              bmp = contentResolver.loadThumbnail(uri, Size(600, 600), null)
                          } catch (e: Exception) {
                          }
                      }
                      if (bmp == null) bmp = fetchWebArt(s, trk, albumTag, aaTag, artistTag)
                      val result = bmp
                      val det = detail
                      val tt = cleanTitle(s.title, trk)
                      runOnUiThread {
                          val cur = queue.getOrNull(index)
                          if (cur != null && cur.id == s.id) {
                              if (result != null) {
                                  art.setImageBitmap(result)
                                  nowArt = result
                              }
                              nowTitle = tt
                              titleTv.text = tt
                              nowInfo = det
                              infoTv.text = det
                          }
                      }
                  }.start()
              }

              // tira o número da faixa do começo do título ("01 - Nome"), sem mexer em "1984" ou "1999"
              private fun cleanTitle(title: String, trackTag: String): String {
                  val m = Regex("^\\s*(\\d{1,3})(\\s*[-–_:]+\\s*|[.)]\\s+|\\s+[.)]\\s+)(.+)$").find(title) ?: return title
                  val num = m.groupValues[1]
                  val sep = m.groupValues[2]
                  val rest = m.groupValues[3].trim()
                  if (!rest.any { it.isLetter() }) return title
                  val tagNum = trackTag.substringBefore('/').trim().toIntOrNull()
                  val matchesTag = tagNum != null && tagNum == num.toInt()
                  val zeroPadded = num.length > 1 && num.startsWith("0")
                  val spaced = sep.any { it.isWhitespace() }
                  return if (matchesTag || zeroPadded || spaced) rest else title
              }

              private fun httpBytes(u: String): ByteArray? {
                  var c: HttpURLConnection? = null
                  return try {
                      c = URL(u).openConnection() as HttpURLConnection
                      c.connectTimeout = 6000
                      c.readTimeout = 8000
                      c.setRequestProperty("User-Agent", "TsukiPlayer/1.0")
                      if (c.responseCode == 200) c.inputStream.use { it.readBytes() } else null
                  } catch (e: Exception) {
                      null
                  } finally {
                      c?.disconnect()
                  }
              }

              // ---------- capa pela internet (com conferência) ----------

              private fun norm(x: String): String {
                  var t = java.text.Normalizer.normalize(x, java.text.Normalizer.Form.NFD).replace(Regex("\\p{M}+"), "")
                  t = t.lowercase().replace("&", " and ")
                  t = t.replace(Regex("[\\(\\[].*?[\\)\\]]"), " ")
                  val toks = ArrayList<String>()
                  for (w in t.split(Regex("[^a-z0-9]+"))) {
                      if (w.isEmpty()) continue
                      toks.add(
                          when (w) {
                              "ii" -> "2"
                              "iii" -> "3"
                              "iv" -> "4"
                              else -> w
                          }
                      )
                  }
                  return toks.joinToString(" ")
              }

              // dois nomes são "o mesmo"? (números precisam coincidir: "Illusion" ≠ "Illusion 2")
              private fun sim(a: String, b: String): Boolean {
                  val na = norm(a)
                  val nb = norm(b)
                  if (na.isEmpty() || nb.isEmpty()) return false
                  if (na == nb) return true
                  val ta = na.split(" ").toSet()
                  val tb = nb.split(" ").toSet()
                  val da = ta.filter { w -> w.all { c -> c.isDigit() } }.toSet()
                  val db = tb.filter { w -> w.all { c -> c.isDigit() } }.toSet()
                  if (da != db) return false
                  if (ta.containsAll(tb) || tb.containsAll(ta)) return Math.min(ta.size, tb.size) >= 2
                  val inter = ta.intersect(tb).size
                  val uni = ta.union(tb).size
                  return uni > 0 && inter.toFloat() / uni >= 0.75f
              }

              private fun parts(a: String): List<String> {
                  val res = ArrayList<String>()
                  if (a.isBlank()) return res
                  res.add(a.trim())
                  for (p in a.split(Regex("(?i)\\s+(feat\\.?|ft\\.?|featuring|with|vs\\.?)\\s+|\\s*[,;/]\\s*"))) {
                      if (p.isNotBlank() && res.none { it.equals(p.trim(), true) }) res.add(p.trim())
                  }
                  return res
              }

              private fun artistOk(found: String, artists: List<String>): Boolean {
                  for (p in parts(found)) for (c in artists) if (sim(p, c)) return true
                  return false
              }

              private fun itunes(term: String, entity: String, limit: Int, country: String): JSONArray? {
                  val url = "https://itunes.apple.com/search?media=music&limit=" + limit + "&entity=" + entity +
                      "&country=" + country + "&term=" + URLEncoder.encode(term, "UTF-8")
                  val txt = httpBytes(url)?.toString(Charsets.UTF_8) ?: return null
                  return try {
                      JSONObject(txt).optJSONArray("results")
                  } catch (e: Exception) {
                      null
                  }
              }

              // procura a capa só se artista, álbum e música "baterem" com o resultado; sem certeza, não mostra capa
              private fun fetchWebArt(s: Song, trk: String, albumTag: String, aaTag: String, artistTag: String): Bitmap? {
                  try {
                      val artists = ArrayList<String>()
                      for (x in listOf(s.artist, artistTag, aaTag)) {
                          if (x.isNotBlank() && x != "Artista desconhecido") {
                              for (p in parts(x)) if (artists.none { it.equals(p, true) }) artists.add(p)
                          }
                      }
                      val albums = ArrayList<String>()
                      fun addAlbum(x: String) {
                          var t = x.replace(Regex("[\\(\\[]\\s*(19|20)\\d{2}\\s*[\\)\\]]"), "").trim()
                          t = t.replace(Regex("^(19|20)\\d{2}\\s*[-–.]\\s*"), "").trim()
                          if (t.length >= 2 && t.lowercase() != "unknown" && albums.none { it.equals(t, true) }) albums.add(t)
                      }
                      addAlbum(s.album)
                      addAlbum(albumTag)
                      val folder = File(s.path).parentFile?.name ?: ""
                      val generic = setOf("music", "musicas", "músicas", "download", "downloads", "audio", "media", "songs", "0", "sdcard", "storage", "emulated")
                      if (folder.isNotBlank() && !generic.contains(folder.lowercase()) && !artists.any { sim(folder, it) }) {
                          addAlbum(folder)
                          if (folder.contains(" - ")) {
                              for (piece in folder.split(" - ")) if (!artists.any { sim(piece, it) }) addAlbum(piece)
                          }
                      }
                      val title = cleanTitle(s.title, trk)
                      if (artists.isEmpty() && albums.isEmpty()) return null

                      val key = (norm(artists.firstOrNull() ?: "") + "|" + (if (albums.isNotEmpty()) norm(albums[0]) else "id" + s.id)).hashCode().toString()
                      val f = File(filesDir, "art2_" + key + ".img")
                      if (f.exists()) {
                          val cached = BitmapFactory.decodeFile(f.absolutePath)
                          if (cached != null) return cached
                      }
                      if (noArt.contains(key)) return null

                      var artUrl = ""
                      for (country in listOf("US", "BR")) {
                          // 1) artista + álbum
                          if (artUrl.isEmpty() && artists.isNotEmpty() && albums.isNotEmpty()) {
                              for (al in albums.take(3)) {
                                  val arr = itunes(artists[0] + " " + al, "album", 10, country) ?: continue
                                  for (i in 0 until arr.length()) {
                                      val o = arr.getJSONObject(i)
                                      if (artistOk(o.optString("artistName"), artists) && sim(o.optString("collectionName"), al)) {
                                          artUrl = o.optString("artworkUrl100", "")
                                          if (artUrl.isNotEmpty()) break
                                      }
                                  }
                                  if (artUrl.isNotEmpty()) break
                              }
                          }
                          // 2) artista + música (e o álbum, se a gente souber qual é)
                          if (artUrl.isEmpty() && artists.isNotEmpty() && title.isNotBlank()) {
                              val arr = itunes(artists[0] + " " + title, "song", 15, country)
                              if (arr != null) {
                                  for (i in 0 until arr.length()) {
                                      val o = arr.getJSONObject(i)
                                      if (!artistOk(o.optString("artistName"), artists)) continue
                                      if (!sim(o.optString("trackName"), title)) continue
                                      if (albums.isNotEmpty() && !albums.any { sim(o.optString("collectionName"), it) }) continue
                                      artUrl = o.optString("artworkUrl100", "")
                                      if (artUrl.isNotEmpty()) break
                                  }
                              }
                          }
                          // 3) álbum + música (sem exigir o artista, se ele for desconhecido)
                          if (artUrl.isEmpty() && albums.isNotEmpty() && title.isNotBlank()) {
                              for (al in albums.take(3)) {
                                  val arr = itunes(al + " " + title, "song", 15, country) ?: continue
                                  for (i in 0 until arr.length()) {
                                      val o = arr.getJSONObject(i)
                                      if (!sim(o.optString("collectionName"), al)) continue
                                      if (!sim(o.optString("trackName"), title)) continue
                                      if (artists.isNotEmpty() && !artistOk(o.optString("artistName"), artists)) continue
                                      artUrl = o.optString("artworkUrl100", "")
                                      if (artUrl.isNotEmpty()) break
                                  }
                                  if (artUrl.isNotEmpty()) break
                              }
                          }
                          if (artUrl.isNotEmpty()) break
                      }
                      if (artUrl.isEmpty()) {
                          noArt.add(key)
                          return null
                      }
                      val bytes = httpBytes(artUrl.replace("100x100bb", "600x600bb")) ?: httpBytes(artUrl) ?: return null
                      val bm = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: return null
                      f.writeBytes(bytes)
                      return bm
                  } catch (e: Exception) {
                  }
                  return null
              }

              private fun toggle() {
                  val m = mp
                  if (m == null) {
                      if (queue.isEmpty()) {
                          queue = ArrayList(shown)
                          queueSource = if (mode == 1) curPl else ""
                      }
                      if (queue.isNotEmpty()) playAt(if (index in queue.indices) index else 0)
                      return
                  }
                  if (m.isPlaying) {
                      m.pause()
                      playBtn.text = "▶"
                  } else {
                      m.start()
                      playBtn.text = "❚❚"
                  }
              }

              private fun next() {
                  if (queue.isEmpty()) return
                  playAt((index + 1) % queue.size)
              }

              private fun prev() {
                  if (queue.isEmpty()) return
                  val m = mp
                  if (m != null && m.currentPosition > 3000) {
                      m.seekTo(0)
                  } else {
                      playAt((index - 1 + queue.size) % queue.size)
                  }
              }

              private fun seekRel(ms: Int) {
                  val m = mp ?: return
                  val p = (m.currentPosition + ms).coerceIn(0, m.duration)
                  m.seekTo(p)
                  seek.progress = p
                  curTv.text = fmt(p)
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TsukiPlayer.apk
          gh release create "v${{ github.run_number }}" TsukiPlayer.apk --title "Tsuki Player v${{ github.run_number }}" --notes "APK pronto para instalar."
